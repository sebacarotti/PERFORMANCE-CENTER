<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Performance Center">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark light">

  <title>Performance Center</title>

  <link rel="manifest" href="./manifest.json?v=3">
  <link rel="icon" sizes="192x192" href="./icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167.png?v=3">
  <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152.png?v=3">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0d12;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0b0d12;
    }

    .topbar {
      height: 54px;
      min-height: 54px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      background: linear-gradient(90deg, #090a0d, #17191f 68%, #3b0b0d);
      border-bottom: 2px solid #d71920;
      box-shadow: 0 4px 18px rgba(0,0,0,.24);
      z-index: 10;
    }

    .topbar img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 9px;
      background: #b7141c;
      flex-shrink: 0;
    }

    .brand {
      min-width: 0;
      flex: 1;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: .2px;
    }

    .brand-subtitle {
      margin-top: 3px;
      font-size: 9px;
      color: #cbd5e1;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .season {
      font-size: 9px;
      font-weight: 800;
      color: #fecaca;
      white-space: nowrap;
    }

    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #f4f7fb;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f7fb;
    }

    .setup {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 80% 0%, rgba(215,25,32,.22), transparent 34%),
        linear-gradient(145deg, #090a0d, #17191f);
      color: white;
      text-align: center;
    }

    .setup-card {
      max-width: 520px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 50px rgba(0,0,0,.32);
    }

    .setup-card img {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      margin-bottom: 16px;
    }

    .setup-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .setup-card p {
      margin: 0;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 50px;
        min-height: 50px;
      }

      .brand-title { font-size: 13px; }
      .brand-subtitle { font-size: 8px; }
      .season { display: none; }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="topbar">
      <img src="./icon-192.png?v=3" alt="SIR SUSA SCAI PERUGIA">
      <div class="brand">
        <div class="brand-title">PERFORMANCE CENTER</div>
        <div class="brand-subtitle">SIR SUSA SCAI PERUGIA • Strength & Performance</div>
      </div>
      <div class="season">2026–2027</div>
    </div>

    <div class="frame-wrap">
      <iframe
        id="performanceFrame"
        title="Performance Center"
        allow="fullscreen"
      ></iframe>

      <div id="setupMessage" class="setup">
        <div class="setup-card">
          <img src="./icon-192.png?v=3" alt="">
          <h1>Performance Center</h1>
          <p>
            Il contenitore PWA è pronto. Manca solo il link pubblico della Web App
            Google Apps Script da collegare a questa schermata.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // INCOLLEREMO QUI IL LINK DELLA WEB APP GOOGLE APPS SCRIPT
    // =========================================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxi1WuohPO1p7PrW2f1jb6_S4F8p4iQmRwq67ta8J-oRyFsDai7ntiILER3qzsZnK5l/exec';

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    document.documentElement.classList.toggle('standalone-mode', isStandalone);

    const frame = document.getElementById('performanceFrame');
    const setup = document.getElementById('setupMessage');

    if (
      APPS_SCRIPT_URL &&
      !APPS_SCRIPT_URL.includes('PASTE_YOUR_APPS_SCRIPT')
    ) {
      frame.src = APPS_SCRIPT_URL;
      setup.style.display = 'none';
    } else {
      frame.style.display = 'none';
      setup.style.display = 'flex';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=3');
      });
    }
  </script>
</body>
</html>
